version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # мелкие обновления одним PR, мажорные — по отдельности (их надо читать)
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ограничено typescript-eslint (<6.1) и eslint-plugin-react (<10) — снимать вместе с ними
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
