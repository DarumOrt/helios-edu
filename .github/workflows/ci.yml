name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# новый пуш в ту же ветку/PR отменяет устаревший прогон
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    name: C# API · PostgreSQL · Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_WEB_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Сборка без BACKEND_API_URL: подключение API должно работать во время запуска.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: docker compose --profile backend up -d --build db api
      - name: Wait for database and API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health/ready
      # Описание API и типы из него должны быть свежими: поменяли C# — выполните npm run api:types и закоммитьте.
      - name: OpenAPI types are up to date
        run: |
          node scripts/api-types.mjs
          git diff --exit-code -- docs/api/openapi.json src/shared/types/api.gen.ts || {
            echo "::error::C# API изменился: выполните npm run api:types (с запущенным API) и закоммитьте docs/api/openapi.json и src/shared/types/api.gen.ts"
            exit 1
          }
      - name: Start Next.js with backend enabled at runtime
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          BACKEND_API_URL=http://127.0.0.1:8080 HOSTNAME=127.0.0.1 PORT=3000 node .next/standalone/server.js > next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
      - run: node --test backend/tests/api.test.mjs
      - run: node --test backend/tests/auth.test.mjs
      - name: Check persistence and seed on restart
        run: node --test backend/tests/lifecycle.test.mjs
      # После рестарта счётчик входов пуст: auth и management не делят лимит 60/мин.
      - run: node --test backend/tests/management.test.mjs
      - run: node --test backend/tests/course-builder.test.mjs
      - run: node --test backend/tests/adaptive.test.mjs
      - run: node --test backend/tests/catalog.test.mjs
      # Вход ограничен 60 разами в минуту с одного адреса (защита от подбора пароля), а все тесты идут
      # с одного адреса. Перезапуск API обнуляет счётчик — дальше тесты не упираются в 429.
      - name: Reset login rate limit
        run: |
          docker compose --profile backend restart api
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health/ready
      - run: node --test backend/tests/grades.test.mjs
      - run: node --test backend/tests/notifications.test.mjs
      - run: node --test backend/tests/files.test.mjs
      # настройки и журнал снова много раз входят под разными ролями — ещё раз обнуляем счётчик входов
      - name: Reset login rate limit again
        run: |
          docker compose --profile backend restart api
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health/ready
      - run: node --test backend/tests/settings.test.mjs
      - run: node --test backend/tests/audit.test.mjs
      - run: node --test backend/tests/tracking.test.mjs
      # корзины и пароли — снова много входов под разными ролями
      - name: Reset login rate limit before trash and accounts
        run: |
          docker compose --profile backend restart api
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/health/ready && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health/ready
      - run: node --test backend/tests/trash.test.mjs
      - run: node --test backend/tests/accounts.test.mjs
      - run: node --test backend/tests/api.test.mjs
      - name: Backend logs
        if: failure()
        run: docker compose --profile backend logs db storage api
      - name: Next.js logs
        if: failure()
        run: cat next.log
      - name: Stop backend
        if: always()
        run: docker compose --profile backend down

  quality:
    name: Typecheck · Lint · Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Модульные тесты правил (Vitest). Шаг внутри этой проверки: имя проверки обязательно в защите main.
      - run: npm test

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: helios-edu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 helios-edu:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/dashboard
      - name: Container logs
        if: failure()
        run: docker logs app
      # публикация в GHCR только из main (не из PR и не из форков)
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
